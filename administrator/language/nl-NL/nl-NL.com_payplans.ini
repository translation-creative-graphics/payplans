COM_PP_INVOICE_EDIT_STATUS_DESC="<strong>Geen Status</strong> - Wanneer factuur niet is uitgecheckt. Betalingsproces nog niet eens gestart.<br /><strong>Afrekening</strong> - Wanneer de factuur is uitgecheckt. Deze status impliceert dat de factuur is bevestigd en nog niet is betaald.<br /><strong>Betaald</strong> - Wanneer het bedrag is betaald voor de factuur.<br /><strong>teruggestort</strong> - Deze status geeft aan dat het factuurbedrag is terugbetaald. Wanneer de factuur is gemarkeerd vanaf betalend naar restitutie dan zal het factuurbedrag worden overgebracht naar de virtuele portemonnee van de gebruiker. Als je handmatig de te retourneren factuur markeert, dan zal het bedrag in de virtuele portemonnee van de gebruiker worden onderhouden. De werkelijke terugbetaling zal worden verwerkt op de betaalgateway account."
